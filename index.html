<!DOCTYPE html>

<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的英文學習小書櫃</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

```
<!-- =========================
     登入區
========================== -->
<section id="authSection" class="card">

  <div class="logo">📚</div>

  <h1>我的英文學習小書櫃</h1>

  <p class="subtitle">
    學單字、聽發音、慢慢累積自己的英文小書櫃
  </p>

  <div class="form-group">
    <label for="username">帳號名稱</label>
    <input
      id="username"
      type="text"
      autocomplete="username"
      placeholder="輸入帳號名稱"
    >
  </div>

  <div class="form-group">
    <label for="password">密碼</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="輸入密碼"
    >
  </div>

  <div class="button-row">
    <button id="loginBtn" class="primary-btn">
      登入
    </button>

    <button id="signupBtn" class="secondary-btn">
      註冊
    </button>
  </div>

  <p id="authMessage" class="message"></p>

</section>


<!-- =========================
     App 主畫面
========================== -->
<section id="appSection" class="hidden">

  <header class="app-header">

    <div>
      <h1>📚 我的英文小書櫃</h1>
      <p>
        歡迎你，<span id="userName"></span>！
      </p>
    </div>

    <button id="logoutBtn" class="logout-btn">
      登出
    </button>

  </header>


  <!-- =========================
       新增單字
  ========================== -->
  <section class="card">

    <h2>➕ 新增單字</h2>

    <div class="add-word-row">

      <input
        id="newWordInput"
        type="text"
        placeholder="輸入英文單字或片語，例如 apple、look after"
        autocomplete="off"
      >

      <button id="addWordBtn" class="primary-btn">
        加入
      </button>

    </div>

    <p id="addWordMessage" class="message"></p>

  </section>


  <!-- =========================
       單字工作區
       左：單字列表
       右：詳細資料
  ========================== -->
  <section class="word-workspace">

    <!-- =========================
         左側：我的單字
    ========================== -->
    <section class="card word-sidebar">

      <div class="word-sidebar-header">

        <div>
          <h2>
            📚 我的單字
            <span id="wordCount">
              （0 個）
            </span>
          </h2>
        </div>

        <button
          id="wordListToggleBtn"
          class="word-list-toggle-btn"
          type="button"
          aria-expanded="true"
          title="收合單字列表"
        >
          ▲
        </button>

      </div>


      <!-- =========================
           搜尋
      ========================== -->
      <div class="search-row">

        <input
          id="searchInput"
          type="text"
          placeholder="搜尋我的單字"
          autocomplete="off"
        >

        <button
          id="searchBtn"
          class="secondary-btn"
          type="button"
        >
          搜尋
        </button>

      </div>


      <!-- =========================
           可收合的單字列表
      ========================== -->
      <div
        id="wordListCollapsible"
        class="word-list-collapsible"
      >

        <div
          id="wordList"
          class="word-list"
        ></div>

        <div
          id="wordPagination"
          class="word-pagination"
        ></div>

      </div>

    </section>


    <!-- =========================
         右側：單字詳細資料
    ========================== -->
    <section
      id="wordDetail"
      class="card word-detail hidden"
    ></section>

  </section>


  <!-- =========================
       資料來源
  ========================== -->
  <details class="source-license">

    <summary>
      📚 資料來源與授權說明
    </summary>

    <div class="source-license-content">

      <p>
        字典資料：TOEIC Traditional Chinese Dictionary
      </p>

      <p>
        英文定義與發音：Merriam-Webster Learner’s Dictionary
      </p>

      <p>
        TOEIC 詞彙資料集授權：CC BY-SA 4.0
      </p>

    </div>

  </details>

</section>
```

  </main>

  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App -->

  <script src="app.js"></script>

</body>
</html>
