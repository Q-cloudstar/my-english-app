<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的英文 APP</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 登入區 -->
  <div id="authSection" class="container">
    <h1>📚 我的英文 APP</h1>

    <div class="card">
      <h2 id="authTitle">登入</h2>

      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="密碼"
        autocomplete="current-password"
      >

      <button id="loginBtn">登入</button>
      <button id="signupBtn" class="secondary">註冊</button>

      <p id="authMessage"></p>
    </div>
  </div>


  <!-- APP 主畫面 -->
  <div id="appSection" class="container hidden">

    <header>
      <div>
        <h1>📚 我的英文 APP</h1>
        <p id="userEmail"></p>
      </div>

      <button id="logoutBtn" class="logout">登出</button>
    </header>

    <div class="card">
      <h2>🔍 我的單字</h2>

      <input
        type="text"
        id="searchInput"
        placeholder="搜尋單字..."
      >

      <button id="searchBtn">搜尋</button>

      <div id="wordList"></div>
    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>

</body>
</html>
